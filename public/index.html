<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATM Docs · Guías</title>
  <meta name="description" content="Guías técnicas de ATM Software Labs. Las destacadas, fijadas por sus autores.">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="canonical" href="https://guides.trujillomingorance.com/">
  <meta name="theme-color" content="#030712">
  <script src="/js/theme-boot.js?v=v7"></script>
  <link rel="stylesheet" href="/css/tokens.css?v=v7">
  <link rel="stylesheet" href="/style.css?v=v7">
  <link rel="stylesheet" href="/css/community.css?v=v7">
</head>
<body class="docs-body">
  <header class="docs-topbar">
    <a href="/" class="brand">
      <img src="/avatar.png" alt="" class="brand-avatar" width="28" height="28">
      <span>ATM Docs</span>
    </a>
    <div class="topbar-actions"></div>
  </header>

  <main class="home-main">
    <section class="hero">
      <p class="kicker" data-i18n="kicker">Documentación técnica</p>
      <h1 data-i18n="hero-title">Guías de ingeniería y runbooks</h1>
      <p class="lede" data-i18n="hero-sub">Arquitecturas reales. En portada, las que sus autores fijan como mejores.</p>
    </section>
    <label class="home-search">
      <input type="search" id="guide-search" placeholder="Buscar guías…" autocomplete="off" spellcheck="false" data-i18n-placeholder="search">
    </label>
    <div class="home-filters" data-notranslate>
      <select id="filter-scope" aria-label="Vista">
        <option value="totes" data-i18n="all" selected>Todas</option>
        <option value="destacades" data-i18n="featured">Destacadas</option>
      </select>
      <select id="filter-kind" aria-label="Tipo">
        <option value="" data-i18n="writeKind">Tipo</option>
        <option value="guide" data-i18n="kind-guide">Guía</option>
        <option value="post" data-i18n="kind-post">Post</option>
        <option value="opinion" data-i18n="kind-opinion">Opinión</option>
        <option value="analysis" data-i18n="kind-analysis">Análisis</option>
        <option value="brief" data-i18n="kind-brief">Brief</option>
        <option value="note" data-i18n="kind-note">Nota</option>
        <option value="research" data-i18n="kind-research">Research</option>
        <option value="changelog" data-i18n="kind-changelog">Changelog</option>
      </select>
      <select id="filter-author" aria-label="Autor">
        <option value="">Autor</option>
      </select>
      <select id="filter-sort" aria-label="Orden">
        <option value="likes" data-i18n="sortLikes">Más votadas</option>
        <option value="recent" data-i18n="sortRecent">Más recientes</option>
        <option value="title" data-i18n="sortTitle">Título</option>
      </select>
      <label class="filter-check"><input type="checkbox" id="filter-pinned"> <span data-i18n="onlyPinned">Solo fijadas</span></label>
      <label class="filter-check"><input type="checkbox" id="filter-saved"> <span data-i18n="onlySaved">Guardadas</span></label>
      <label class="filter-check"><input type="checkbox" id="filter-following"> <span data-i18n="onlyFollowing">Siguiendo</span></label>
    </div>
    <p class="home-label" id="home-label" data-i18n="all">Todas</p>
    <div class="guides-grid" id="guides-feed"></div>
  </main>

  <script src="/js/i18n.js?v=v7"></script>
  <script src="/js/chrome.js?v=v7"></script>
  <script src="/js/auth-modal.js?v=v7"></script>
  <script src="/js/social.js?v=v7"></script>
  <script src="/js/feed.js?v=v7"></script>
  <script src="/js/translate.js?v=v7"></script>
</body>
</html>
