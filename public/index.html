<body class="docs-body">
  <header class="docs-topbar">
    <a href="/" class="brand">

      <span>ATM Docs</span>
    </a>
    <div class="topbar-actions"></div>
  </header>

  <main class="home-main">
    <section class="hero">
      <p class="kicker" data-i18n="kicker">Documentación técnica</p>
      <h1 data-i18n="hero-title">Guías técnicas y análisis</h1>
      <p class="lede" data-i18n="hero-sub">Guías prácticas. En portada, las que sus autores fijan como mejores.</p>

    <label class="home-search">
      <input type="search" id="guide-search" placeholder="Buscar guías…" autocomplete="off" spellcheck="false" data-i18n-placeholder="search">
    </label>
    <div class="home-filters" data-notranslate>
      <select id="filter-scope" aria-label="Vista" data-i18n-aria="s_dd09ff7d">
        <option value="totes" data-i18n="all" selected>Todas</option>
        <option value="destacades" data-i18n="featured">Destacadas</option>
      </select>
      <select id="filter-kind" aria-label="Tipo" data-i18n-title="writeKind">
        <option value="" data-i18n="writeKind">Tipo</option>
        <option value="guide" data-i18n="kind-guide">Guía</option>
        <option value="post" data-i18n="kind-post">Post</option>
        <option value="opinion" data-i18n="kind-opinion">Opinión</option>
        <option value="analysis" data-i18n="kind-analysis">Análisis</option>
        <option value="brief" data-i18n="kind-brief">Brief</option>
        <option value="note" data-i18n="kind-note">Nota</option>
        <option value="research" data-i18n="kind-research">Research</option>
        <option value="changelog" data-i18n="kind-changelog">Changelog</option>

      <select id="filter-author" aria-label="Autor" data-i18n-title="author_label">
        <option value="" data-i18n="author_label">Autor</option>
      </select>
      <select id="filter-sort" aria-label="Orden">
        <option value="likes" data-i18n="sortLikes">Más votadas</option>
        <option value="recent" data-i18n="sortRecent">Más recientes</option>
        <option value="title" data-i18n="sortTitle">Título</option>
      </select>
      <label class="filter-check">
        <input type="checkbox" id="filter-pinned">
        <svg class="filter-ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 2l6 6-4 4 1 7-7-1-4 4-2-2 4-4-1-7 7 1 4-4z"/></svg>
        <span data-i18n="onlyPinned">Solo fijadas</span>

      <label class="filter-check">
        <input type="checkbox" id="filter-saved">
        <svg class="filter-ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span data-i18n="onlySaved">Guardadas</span>
