  <div class="guide-container doc-page has-toc-sidebar" id="guide-viewer">
    <header class="doc-header">
      <a href="/" class="back-nav" data-i18n="backHub">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span data-i18n="backHub">Volver al Hub de Guías</span>
      </a>

      <h1 class="page-title" id="viewer-title">Cargando guía...</h1>
      <div id="guide-meta-bar" class="poster meta-bar poster-bar">
        <div class="poster-author">
          <span class="poster-avatar" id="viewer-avatar">AT</span>
          <span class="poster-name" id="viewer-author">Alberto Trujillo</span>
          <a class="poster-handle" id="viewer-handle" href="/u/@atrumin16">@atrumin16</a>
        </div>
        <div class="poster-right">
          <time class="poster-date meta-chip" id="viewer-date">2026</time>
          <button type="button" class="copy-link poster-copy meta-chip" id="copy-link">
            <svg class="tool-ic" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <span data-i18n="copy">Copiar enlace</span>
          </button>
        </div>
      </div>
      <div id="guide-social-bar" class="social-bar"></div>

      <p class="page-subtitle" id="viewer-subtitle"></p>
    </header>

    <div class="doc-layout">
      <aside class="doc-sidebar" id="viewer-sidebar"></aside>
      <div class="doc-content">
        <article id="guide-body" class="md-body doc"></article>
        <aside id="guide-attachments" class="attach-list" hidden></aside>
      </div>
    </div>
  </div>

  <script type="text/markdown" id="guide-markdown"></script>
  <script type="application/json" id="guide-payload">{"attachments":[],"widgets":[]}</script>

  <!-- High-Speed In-Memory Catalog & SPA Client Router (0ms Latency, 0 Workers) -->
  <script>
    (function () {
      var ALIASES = {
        'enterprise-email': 'correo-corporativo-startups',
        'infraestructura-de-correo-corporativo-para-start': 'correo-corporativo-startups',
        'infraestructura-de-correo-corporativo-para-startups-a-coste-0': 'correo-corporativo-startups',
        'correo-corporativo': 'correo-corporativo-startups',
        'desglose-de-cartera-y-simulador-de-berkshire-hat': 'desglose-cartera-berkshire-brk',
        'desglose-de-cartera-y-simulador-de-berkshire-hathaway': 'desglose-cartera-berkshire-brk',
        'desglose-cartera-berkshire': 'desglose-cartera-berkshire-brk',
        'berkshire': 'desglose-cartera-berkshire-brk',
        'msft': 'informe-msft',
        'microsoft': 'informe-msft',
        'glosario': 'it-glossary',
        'glossary': 'it-glossary',
        'glossari': 'it-glossary'
      };

      function getCurrentGuideId() {
        try {
          var params = new URLSearchParams(window.location.search);
          var qId = params.get('id') || params.get('slug') || params.get('g') || params.get('piece');
          if (qId) {
            var cleanQ = qId.toLowerCase().trim();
            return ALIASES[cleanQ] || cleanQ;
          }
        } catch (e) {}
        var p = window.location.pathname || '';
        var m = p.match(/\/(?:guides|g|s)\/([a-z0-9-._]+)/i);
        if (m && m[1]) {
          var cleanP = m[1].toLowerCase().trim().replace(/\/+$/, '');
          if (cleanP !== 'g.html' && cleanP !== 'g' && cleanP !== 'guides' && cleanP !== 's') {
            return ALIASES[cleanP] || cleanP;
          }
        }
        return null;
      }

      var currentGuide = null;

      function applyGuide(guide, preferredLang) {
        if (!guide) {
          document.title = 'Pieza no encontrada · ATM Docs';
          document.body.classList.add('is-not-found');
          var titleEl = document.getElementById('viewer-title');
          if (titleEl) titleEl.textContent = 'Pieza no encontrada';
          var subEl = document.getElementById('viewer-subtitle');
          if (subEl) subEl.textContent = 'El documento solicitado no existe o ha sido reubicado.';
          var metaBar = document.getElementById('guide-meta-bar');
          if (metaBar) metaBar.style.display = 'none';
          var sidebar = document.getElementById('viewer-sidebar');
          if (sidebar) sidebar.style.display = 'none';
          var bodyEl = document.getElementById('guide-body');
          if (bodyEl) {
            bodyEl.innerHTML = '<div style="padding: 60px 20px; text-align: center; color: #94a3b8;">' +
              '<h1 style="color: #f8fafc; font-size: 24px; margin-bottom: 12px;">Pieza no encontrada</h1>' +
              '<p style="margin-bottom: 24px;">No se encontró ningún artículo con el identificador: <code style="color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 2px 6px; border-radius: 4px;">' + (currentSlug || 'desconocido') + '</code></p>' +
              '<a href="/" style="color: #38bdf8; text-decoration: underline; font-weight: 500;">Volver al índice</a>' +
              '</div>';
          }
          return;
        }

        currentGuide = guide;
        window.__currentGuide = guide;
        var lang = preferredLang || (typeof window.atmLang === 'function' ? window.atmLang() : 'es');

        // Check for translations
        var itemData = guide;
        if (guide.translations && guide.translations[lang]) {
          itemData = Object.assign({}, guide, guide.translations[lang]);
        } else if (guide.translations && guide.translations['es']) {
          itemData = Object.assign({}, guide, guide.translations['es']);
        }

        var postTitle = itemData.title || guide.title || '';
        document.title = postTitle + ' · ATM Docs';
        var titleEl = document.getElementById('viewer-title');
        if (typeof window.formatTitleTickers === 'function') {
          titleEl.innerHTML = window.formatTitleTickers(postTitle);
        } else {
          titleEl.textContent = postTitle;
        }

        var subEl = document.getElementById('viewer-subtitle');
        if (subEl) subEl.textContent = itemData.summary || guide.summary || '';

        var authorEl = document.getElementById('viewer-author');
        if (authorEl) authorEl.textContent = itemData.authorName || guide.authorName || 'Alberto Trujillo';

        var handleEl = document.getElementById('viewer-handle');
        if (handleEl) {
          var h = (itemData.handle || guide.handle) ? '@' + String(itemData.handle || guide.handle).replace(/^@/, '') : '@atrumin16';
          handleEl.textContent = h;
          handleEl.href = '/u/' + h;
        }

        var dateEl = document.getElementById('viewer-date');
        if (dateEl) dateEl.textContent = itemData.date || guide.date || '2026';

        var activeSlug = itemData.slug || guide.slug || currentSlug;
        var copyBtn = document.getElementById('copy-link');
        if (copyBtn) copyBtn.setAttribute('data-slug', activeSlug);

        var metaBar = document.getElementById('guide-meta-bar');
        if (metaBar) metaBar.setAttribute('data-slug', activeSlug);

        var socialBar = document.getElementById('guide-social-bar');
        if (socialBar) socialBar.setAttribute('data-slug', activeSlug);

        var rawContent = itemData.content || itemData.body || itemData.markdown || itemData.markdown_text || guide.content || guide.body || '';

        // Strip duplicate heading if identical to title
        if (typeof window.stripDuplicateHeading === 'function') {
          rawContent = window.stripDuplicateHeading(rawContent, postTitle);
        } else {
          var normT = postTitle.toLowerCase().replace(/[$#*_\(\)\[\]:!¡?¿`'"]/g, '').replace(/\s+/g, ' ').trim();
          var m = rawContent.match(/^(\s*#{1,3}\s+)([^\n\r]+)([\r\n]+)/);
          if (m) {
            var hT = m[2].trim().toLowerCase().replace(/[$#*_\(\)\[\]:!¡?¿`'"]/g, '').replace(/\s+/g, ' ').trim();
            if (hT === normT || normT.indexOf(hT) !== -1 || hT.indexOf(normT) !== -1) {
              rawContent = rawContent.slice(m[0].length).trim();
            }
          }
        }

        var mdEl = document.getElementById('guide-markdown');
        if (mdEl) mdEl.textContent = rawContent;

        var bodyEl = document.getElementById('guide-body');
        if (bodyEl && rawContent) {
          if (window.marked && typeof window.marked.parse === 'function') {
            bodyEl.innerHTML = window.marked.parse(rawContent);

            // Remove duplicate first H1/H2 if identical to title
            var firstH = bodyEl.querySelector('h1:first-child, h2:first-child');
            if (firstH && postTitle) {
              var nF = firstH.textContent.toLowerCase().replace(/[$#*_\(\)\[\]:!¡?¿`'"]/g, '').replace(/\s+/g, ' ').trim();
              var nT = postTitle.toLowerCase().replace(/[$#*_\(\)\[\]:!¡?¿`'"]/g, '').replace(/\s+/g, ' ').trim();
              if (nF === nT || nT.indexOf(nF) !== -1 || nF.indexOf(nT) !== -1) {
                firstH.remove();
              }
            }

            if (typeof window.linkifyTickers === 'function') {
              window.linkifyTickers(bodyEl);
            }

            if (typeof window.initBrkCalculator === 'function') {
              window.initBrkCalculator(bodyEl);
            }
          }
        }

        if (typeof window.atmRerenderGuide === 'function') {
          window.atmRerenderGuide();
        }

        if (typeof window.atmHydrateSocial === 'function') {
          window.atmHydrateSocial(activeSlug);
        }

        if (typeof window.atmApplyUi === 'function') {
          window.atmApplyUi(lang);
        }

        document.dispatchEvent(new CustomEvent('atm:content', { detail: { slug: activeSlug, lang: lang } }));
      }

      window.atmApplyGuide = applyGuide;

      var currentSlug = getCurrentGuideId();

      if (!currentSlug) {
        applyGuide(null);
        return;
      }

      // 1. Check localStorage first for recently published local guides
      try {
        var localList = JSON.parse(localStorage.getItem('atm_guides_data') || localStorage.getItem('atm_custom_guides') || localStorage.getItem('atm_local_guides') || '[]');
        if (Array.isArray(localList)) {
          var foundLocal = localList.find(function (g) {
            var s = String(g.slug || g.id || '').toLowerCase().trim();
            return s === currentSlug || ALIASES[s] === currentSlug;
          });
          if (foundLocal) {
            applyGuide(foundLocal);
            return;
          }
        }
      } catch (e) {}

      // 2. Fetch static catalog
      fetch('/data/guides.json', { cache: 'default' })
        .then(function (r) {
          if (!r.ok) return fetch('/community-index.json').then(function (res) { return res.json(); });
          return r.json();
        })
        .then(function (data) {
          var list = (data && (data.guides || data.items)) || [];
          var found = list.find(function (g) {
            var s = String(g.slug || g.id || '').toLowerCase().trim();
            return s === currentSlug || ALIASES[s] === currentSlug;
          });
          if (found) {
            applyGuide(found);
          } else {
            applyGuide(null);
          }
        })
        .catch(function () {
          applyGuide(null);
        });

      // 3. Listen to language changes
      document.addEventListener('atm:lang', function (e) {
        var newLang = e && e.detail && e.detail.lang;
        if (currentGuide) {
          applyGuide(currentGuide, newLang);
        }
      });
    })();
  </script>

  <script src="/js/chrome.js?v=v7"></script>
  <script src="/js/social.js?v=v7"></script>
  <script src="/js/forum.js?v=v7"></script>
  <script src="/js/translate.js?v=v7"></script>
</body>
</html>
