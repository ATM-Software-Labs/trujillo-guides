name: Interactive Sentinel Bot Dispatcher

on:
  issue_comment:
    types: [ created ]

permissions:
  issues: write
  pull-requests: write

jobs:
  command:
    name: Process Slash Command
    if: startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest

    steps:
      - name: Execute Interactive Command
        uses: actions/github-script@v9
        with:
          script: |
            const comment = context.payload.comment.body.trim();
            const author = context.payload.comment.user.login;
            const issueNumber = context.issue.number;

            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket'
              });
            } catch (e) {}

            const parts = comment.split(/\s+/);
            const cmd = parts[0].toLowerCase();
            const args = parts.slice(1);

            let reply = '';

            switch (cmd) {
              case '/ping':
                reply = `🤖 **trujillo-bot [Online]**\n\n- Infrastructure Runbook Engine: \`ACTIVE\`\n- Asset Pipeline: \`HEALTHY\`\n- Operator: @${author}`;
                break;

              case '/status':
                reply = `### 🛡️ Trujillo Guides Infrastructure Status\n\n| Component | Target Runtime | Status |\n| :--- | :--- | :---: |\n| **Static Engine** | Cloudflare Edge Pages | \`OPTIMAL\` |\n| **Asset Validator** | Automated CI / HTML5 | \`VERIFIED\` |\n| **Email Runbooks** | SPF / DKIM / DMARC Specs | \`CURRENT\` |`;
                break;

              case '/label':
                if (args.length === 0) {
                  reply = `⚠️ **Usage:** \`/label <label-name>\``;
                } else {
                  const labelName = args.join(' ');
                  try {
                    await github.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNumber,
                      labels: [labelName]
                    });
                    reply = `✅ Label \`${labelName}\` assigned successfully.`;
                  } catch (err) {
                    reply = `❌ Failed to assign label \`${labelName}\`: ${err.message}`;
                  }
                }
                break;

              case '/close':
                const reason = args.join(' ') || 'Resolved by maintainer request';
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `🔒 **trujillo-bot Audit:** Ticket closed by @${author}.\n*Reason:* ${reason}`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed'
                });
                return;

              case '/reopen':
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'open'
                });
                reply = `🔓 Ticket reopened by @${author}. Active telemetry restored.`;
                break;

              case '/help':
                reply = `### 🤖 trujillo-bot Command Registry\n\nAvailable interactive slash commands:\n- \`/ping\` — Verify bot connectivity and operational health\n- \`/status\` — Display infrastructure diagnostic matrix\n- \`/label <name>\` — Apply classification label to this ticket\n- \`/close [reason]\` — Close ticket with audit note\n- \`/reopen\` — Reopen previously resolved ticket\n- \`/help\` — Display this command registry`;
                break;

              default:
                reply = `⚠️ Unknown command \`${cmd}\`. Type \`/help\` to inspect available commands.`;
                break;
            }

            if (reply) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: reply
              });
            }
